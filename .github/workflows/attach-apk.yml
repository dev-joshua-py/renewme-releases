# Copies a finished app build from Expo's servers onto a release in this
# repository. It runs on GitHub's side, so a large file never has to travel
# through the developer's own internet connection.
name: Attach APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: Where to download the APK from
        required: true
      tag:
        description: The release to attach it to
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download the build
        env:
          APK_URL: ${{ inputs.url }}
        run: curl --fail --location --retry 5 --retry-delay 5 --output renewme.apk "$APK_URL"

      - name: Check it is an app file
        run: |
          test "$(head -c 2 renewme.apk)" = "PK"
          test "$(stat -c %s renewme.apk)" -gt 5000000
          echo "size: $(stat -c %s renewme.apk) bytes"
          sha256sum renewme.apk

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" renewme.apk --clobber --repo "$GITHUB_REPOSITORY"
